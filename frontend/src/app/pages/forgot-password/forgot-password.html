<div class="login-container">
  <div class="login-card">
    <img src="/logo-login.png" alt="AlbideyNet" class="login-logo">
    <p class="subtitle">{{ 'forgotPassword.subtitle' | translate }}</p>

    @if (!successMessage()) {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">{{ 'forgotPassword.emailLabel' | translate }}</label>
          <div class="input-with-icon">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            </span>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="admin@albideynet.com"
            />
          </div>
        </div>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="loading()">
          <span class="btn-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </span>
          {{ loading() ? ('forgotPassword.sending' | translate) : ('forgotPassword.submit' | translate) }}
        </button>
      </form>
    } @else {
      <p class="success">{{ successMessage() }}</p>
    }

    <p class="signup-hint">
      <a routerLink="/login">{{ 'forgotPassword.backToLogin' | translate }}</a>
    </p>
  </div>
</div>
