<div class="login-container">
  <div class="login-card">
    <img src="/logo-login.png" alt="AlbideyNet" class="login-logo">
    <p class="subtitle">{{ 'resetPassword.subtitle' | translate }}</p>

    @if (!successMessage()) {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="newPassword">{{ 'resetPassword.newPasswordLabel' | translate }}</label>
          <div class="input-with-icon">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
            </span>
            <input
              id="newPassword"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              placeholder="********"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">{{ 'resetPassword.confirmPasswordLabel' | translate }}</label>
          <div class="input-with-icon">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
            </span>
            <input
              id="confirmPassword"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              placeholder="********"
            />
          </div>
        </div>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="loading()">
          <span class="btn-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </span>
          {{ loading() ? ('resetPassword.saving' | translate) : ('resetPassword.submit' | translate) }}
        </button>
      </form>
    } @else {
      <p class="success">{{ successMessage() }}</p>
    }

    <p class="signup-hint">
      <a routerLink="/login">{{ 'resetPassword.backToLogin' | translate }}</a>
    </p>
  </div>
</div>
